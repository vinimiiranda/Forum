spring.application.name=forum_hub

# ---------------------------------------------------------------------------
# Banco de dados
# Configure as variaveis de ambiente antes de subir a aplicacao (.env.example).
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/forum_hub?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------------------------------------------------------------------------
# Seguranca
# ---------------------------------------------------------------------------
api.security.token.secret=${JWT_SECRET:troque-este-segredo-em-producao}

# ---------------------------------------------------------------------------
# Envio de e-mail
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------------
# Login social (OAuth2)
# ---------------------------------------------------------------------------
github.oauth.client.id=${GITHUB_CLIENT_ID:}
github.oauth.client.secret=${GITHUB_CLIENT_SECRET:}

google.oauth.client.id=${GOOGLE_CLIENT_ID:}
google.oauth.client.secret=${GOOGLE_CLIENT_SECRET:}

# ---------------------------------------------------------------------------
# Documentacao da API -> http://localhost:8080/swagger-ui.html
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/v3/api-docs
